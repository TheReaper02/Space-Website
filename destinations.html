<!DOCTYPE html>
<html lang="en" class="max-w-[2560px] mx-auto max-h-[1440px] bg-[#0B0D17]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bellefair&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Space tourism website</title>

  <style>
    
    .font-barlow {
      font-family: 'Barlow Condensed', sans-serif;
    }

    .font-bellefair {
      font-family: 'Bellefair', serif;
    }
  </style>
  <script src="https://cdn.tailwindcss.com/"></script>
</head>
<body class="bg-[url('./assets/destination/background-destination-mobile.jpg')] md:bg-[url('./assets/destination/background-destination-tablet.jpg')] lg:bg-[url('./assets/destination/background-destination-desktop.jpg')] bg-cover bg-no-repeat text-center text-white w-full min-h-screen overflow-x-hidden">
    <div id="mobile-menu" class="fixed top-0 right-0 w-[70vw] h-full z-50 flex flex-col justify-between transform translate-x-full transition-transform duration-300 backdrop-blur-md lg:hidden">
    <div class="flex justify-between items-center w-11/12 max-w-sm mx-auto mt-8 mb-6 md:w-full md:max-w-none md:mx-0 md:px-6">
      <button aria-label="Close Menu" class="absolute top-8 right-8 z-50">
        <img src="./assets/shared/icon-close.svg" alt="Close Menu Icon" class="h-6 w-6">
      </button>
    </div>
    <nav class="flex flex-col items-center justify-start flex-1 mt-8">
      <div class="w-11/12 max-w-sm mx-auto p-6 flex flex-col items-center">
      <ul class="flex flex-col w-full font-barlow">
        <li><a href="./index.html" class="block uppercase text-white text-lg py-4 w-full text-left font-light tracking-widest text-lg
          border-r-2 border-transparent hover:border-white transition-colors duration-300">
          <span class="font-bold">00</span> Home</a></li>
        <li><a href="./destinations.html" class="block uppercase text-white text-lg py-4 w-full text-left font-light tracking-widest text-lg
          border-r-2 border-white hover:border-white transition-colors duration-300">
          <span class="font-bold">01</span> Destination</a></li>
        <li><a href="./crew.html" class="block uppercase text-white text-lg py-4 w-full text-left font-light tracking-widest text-lg
          border-r-2 border-transparent hover:border-white transition-colors duration-300">
          <span class="font-bold">02</span> Crew</a></li>
        <li><a href="./technology.html" class="block uppercase text-white text-lg py-4 w-full text-left font-light tracking-widest text-lg
          border-r-2 border-transparent hover:border-white transition-colors duration-300">
          <span class="font-bold">03</span> Technology</a></li>
      </ul>
      </div>
    </nav>
  </div>
  
  
  
<header class="flex items-center justify-between w-full px-6 py-6">
  <img src="./assets/shared/logo.svg" alt="Space Tourism Logo">

  
  <div class="hidden lg:block flex-1 h-px bg-white/20 mx-8 z-10 relative"></div>

  
  <nav class="hidden md:block backdrop-blur-md bg-white/5 border-b border-white/10">
    <ul class="flex gap-8 px-12 py-6 uppercase tracking-widest text-sm text-white">
      <li>
        <a href="./index.html" class="font-barlow text-lg tracking-widest flex gap-2 pb-6 border-b-2 border-transparent hover:border-white/50 transition-colors duration-300">
          <span class="font-bold">00</span> Home
        </a>
      </li>
      <li>
        <a href="./destinations.html" class="font-barlow text-lg tracking-widest flex gap-2 pb-6 border-b-2 border-white hover:border-white/50 transition-colors duration-300">
          <span class="font-bold">01</span> Destination
        </a>
      </li>
      <li>
        <a href="./crew.html" class="font-barlow text-lg tracking-widest flex gap-2 pb-6 border-b-2 border-transparent hover:border-white/50 transition-colors duration-300">
          <span class="font-bold">02</span> Crew
        </a>
      </li>
      <li>
        <a href="./technology.html" class="font-barlow text-lg tracking-widest flex gap-2 pb-6 border-b-2 border-transparent hover:border-white/50 transition-colors duration-300">
          <span class="font-bold">03</span> Technology
        </a>
      </li>
    </ul>
  </nav>

  
  <button aria-label="Open Menu" class="md:hidden" id="open-menu-btn">
    <img src="./assets/shared/icon-hamburger.svg" alt="Menu Icon">
  </button>
</header>

  <main class="flex flex-col items-center mt-8 px-4 md:mt-16 md:gap-12 lg:flex-row lg:justify-center lg:items-start lg:gap-32 lg:px-24">
    
    <div class="flex-shrink-0 mb-8 md:mb-12 lg:mb-0">
      <img id="destination-image" alt="" src="" class="mx-auto w-40 h-40 md:w-72 md:h-72 lg:w-96 lg:h-96 object-contain">
    </div>
    
    <div class="flex flex-col items-center lg:items-start text-center lg:text-left max-w-xl w-full">
      <h1 class="font-barlow tracking-widest text-base md:text-lg uppercase mb-8 md:mb-12">
        <span class="text-gray-500 font-bold mr-4">01</span> Pick your destination
      </h1>
      <nav class="flex gap-6 mb-8 md:mb-12" role="tablist" aria-label="Destinations tabs">
        <button class="tab font-barlow uppercase tracking-widest" id="tab-moon" role="tab" aria-selected="true">Moon</button>
        <button class="tab font-barlow uppercase tracking-widest" id="tab-mars" role="tab" aria-selected="false">Mars</button>
        <button class="tab font-barlow uppercase tracking-widest" id="tab-europa" role="tab" aria-selected="false">Europa</button>
        <button class="tab font-barlow uppercase tracking-widest" id="tab-titan" role="tab" aria-selected="false">Titan</button>
      </nav>
      <div id="destination-content" class="transition-opacity duration-300 opacity-100">
        <h2 id="destination-title" class="font-bellefair text-4xl md:text-6xl lg:text-7xl uppercase mb-4"></h2>
        <p id="destination-description" class="font-barlow text-base md:text-lg mb-8 max-w-xs md:max-w-md lg:max-w-xl"></p>
        <div class="flex flex-col gap-8 border-t border-gray-700 pt-8 w-full max-w-xs md:max-w-md lg:max-w-xl lg:flex-row lg:gap-24">
          <div>
            <span class="text-base font-barlow tracking-widest text-gray-400 uppercase">Avg. distance</span>
            <div id="destination-distance" class="font-bellefair text-2xl"></div>
          </div>
          <div>
            <span class="text-base font-barlow tracking-widest text-gray-400 uppercase">Est. travel time</span>
            <div id="destination-travel-time" class="font-bellefair text-2xl mb-2"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./script/destination.js"></script>
</body>
</html>
